<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zero Assistant</title>
<style>
*{box-sizing:border-box}:root{--bg:#0b1020;--panel:#11182b;--panel2:#18223a;--text:#eef3ff;--muted:#8e9ab5;--accent:#5b8cff;--accent2:#7c5cff;--border:rgba(255,255,255,.08);--user:#2456c7;--zero:#18233b}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(91,140,255,.18),transparent 30%),radial-gradient(circle at 85% 20%,rgba(124,92,255,.15),transparent 30%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center}.app{width:min(1050px,100%);height:100vh;display:flex;flex-direction:column;padding:14px}.topbar{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--border);background:rgba(17,24,43,.86);backdrop-filter:blur(18px);border-radius:18px 18px 10px 10px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 28px rgba(91,140,255,.25);font-size:23px}.title{font-weight:800;font-size:19px}.subtitle{color:var(--muted);font-size:12px;margin-top:3px}.status{display:flex;align-items:center;gap:7px;color:#aeb9d2;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#52d273;box-shadow:0 0 12px rgba(82,210,115,.8)}.chat{flex:1;overflow-y:auto;padding:20px 8px;scrollbar-width:thin}.welcome{max-width:720px;margin:5vh auto 25px;text-align:center}.welcome h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}.welcome p{color:var(--muted);margin:0 auto 20px;line-height:1.6}.chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.chip{border:1px solid var(--border);background:rgba(24,34,58,.8);color:#cbd5ed;border-radius:999px;padding:9px 13px;cursor:pointer}.chip:hover{border-color:rgba(91,140,255,.6);transform:translateY(-1px)}.message{display:flex;margin:13px auto;max-width:860px;gap:10px;animation:appear .18s ease-out}.message.user{justify-content:flex-end}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--border)}.message.user .avatar{order:2}.bubble{max-width:min(75%,720px);padding:12px 15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--border);border-radius:17px}.message.zero .bubble{background:var(--zero);border-top-left-radius:5px}.message.user .bubble{background:linear-gradient(135deg,var(--user),#4b5fe0);border-top-right-radius:5px}.typing{display:none;max-width:860px;margin:0 auto 10px;color:var(--muted);font-size:13px;align-items:center;gap:8px}.typing.show{display:flex}.dots span{display:inline-block;width:5px;height:5px;margin:0 2px;background:#9caad0;border-radius:50%;animation:blink 1.2s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}.composer-wrap{padding:10px 0 0}.composer{display:flex;gap:9px;align-items:flex-end;max-width:860px;margin:auto;padding:9px;background:rgba(17,24,43,.92);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 45px rgba(0,0,0,.22)}textarea{flex:1;resize:none;max-height:140px;min-height:43px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px 8px}textarea::placeholder{color:#71809e}button{border:0;color:white;cursor:pointer;font:inherit}.send{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:19px}.send:disabled{opacity:.45;cursor:not-allowed}.bottom{display:flex;justify-content:space-between;align-items:center;max-width:860px;margin:8px auto 0;color:#687694;font-size:11px}.clear{background:transparent;color:#8e9ab5;padding:4px 6px}.clear:hover{color:white}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}@media(max-width:650px){.app{padding:7px}.topbar{border-radius:15px}.bubble{max-width:84%}.welcome{margin-top:8vh}.status{display:none}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">🤖</div><div><div class="title">ZERO Assistant</div><div class="subtitle">Trợ lý AI điều khiển điện thoại</div></div></div><div class="status">
        <span class="dot"></span> Web Server đang hoạt động
        <button id="voiceToggle" class="voice-toggle" type="button" title="Bật/tắt giọng nói">🔊</button>
    </div></header>
<main id="chat" class="chat"><section id="welcome" class="welcome"><h1>Xin chào! 👋</h1><p>Mình là Zero. Bạn có thể trò chuyện hoặc ra lệnh điều khiển điện thoại ngay tại đây.</p><div class="chips"><button class="chip" data-text="Xin chào Zero!">💬 Trò chuyện</button><button class="chip" data-text="Pin điện thoại còn bao nhiêu phần trăm?">🔋 Kiểm tra pin</button><button class="chip" data-text="Mở YouTube">📱 Mở YouTube</button><button class="chip" data-text="Kiểm tra bộ nhớ điện thoại">💾 Bộ nhớ</button></div></section></main>
<div id="typing" class="typing"><span>🤖 Zero đang xử lý</span><span class="dots"><span></span><span></span><span></span></span></div>
<section class="composer-wrap"><form id="form" class="composer"><textarea id="input" rows="1" placeholder="Nhắn tin hoặc ra lệnh cho Zero..." autocomplete="off"></textarea><button id="send" class="send" type="submit" title="Gửi">➤</button></form><div class="bottom"><span>Enter để gửi · Shift + Enter để xuống dòng</span><button id="clear" class="clear" type="button">Xóa cuộc trò chuyện</button></div></section></div>
<script>const chat=document.getElementById("chat"),input=document.getElementById("input"),form=document.getElementById("form"),send=document.getElementById("send"),typing=document.getElementById("typing"),welcome=document.getElementById("welcome"),clearBtn=document.getElementById("clear"),STORAGE_KEY="zero_web_chat_v1";let history=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");function scrollBottom(){requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}function addMessage(role,text,save=true){if(welcome)welcome.style.display="none";const row=document.createElement("div");row.className="message "+(role==="user"?"user":"zero");const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"👤":"🤖";const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;row.appendChild(avatar);row.appendChild(bubble);chat.appendChild(row);if(save){history.push({role,text});if(history.length>100)history=history.slice(-100);localStorage.setItem(STORAGE_KEY,JSON.stringify(history))}scrollBottom()}function renderHistory(){if(!history.length)return;if(welcome)welcome.style.display="none";history.forEach(m=>addMessage(m.role,m.text,false))}async function sendMessage(message){message=message.trim();if(!message||send.disabled)return;addMessage("user",message);input.value="";autoResize();send.disabled=true;typing.classList.add("show");scrollBottom();try{const response=await fetch("/api/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command:message})});let data;try{data=await response.json()}catch{throw new Error("Server trả về dữ liệu không hợp lệ.")}if(!response.ok)throw new Error(data.reply||`HTTP ${response.status}`);addMessage("zero",data.reply||"Zero không có phản hồi.")}catch(error){addMessage("zero","❌ Không thể kết nối tới Zero: "+error.message)}finally{send.disabled=false;typing.classList.remove("show");input.focus()}}form.addEventListener("submit",e=>{e.preventDefault();sendMessage(input.value)});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});function autoResize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px"}input.addEventListener("input",autoResize);document.querySelectorAll(".chip").forEach(chip=>chip.addEventListener("click",()=>sendMessage(chip.dataset.text)));clearBtn.addEventListener("click",()=>{history=[];localStorage.removeItem(STORAGE_KEY);chat.innerHTML="";chat.appendChild(welcome);welcome.style.display="block";input.focus()});renderHistory();input.focus();</script>
</body></html>
