<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Assistant - Điều khiển Android</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold text-blue-400">🤖 Zero Assistant</span>
            <span class="text-xs bg-green-600 text-white px-2 py-0.5 rounded-full">Online</span>
        </div>
        <button onclick="toggleKeyModal()" class="bg-gray-700 hover:bg-gray-600 text-yellow-400 px-3 py-1.5 rounded-lg flex items-center space-x-1 transition">
            <span>🔑</span>
            <span class="text-sm font-medium">Cấu hình Key</span>
        </button>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="bg-gray-800 border border-gray-700 text-gray-100 rounded-2xl px-4 py-2.5 max-w-md shadow">
                Xin chào! Tôi là Zero, trợ lý ảo điều khiển Android của bạn. Bạn muốn tôi giúp gì nào?
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 p-4">
        <form autocomplete="off" onsubmit="event.preventDefault(); sendCommand();" class="max-w-4xl mx-auto flex items-center space-x-2">
            <button type="button" id="mic-btn" onclick="toggleSpeechRecognition()" class="bg-gray-700 hover:bg-gray-600 text-white p-3 rounded-xl transition" title="Nói chuyện">
                🎙️
            </button>
            <input type="text" id="user-input" name="no_autofill_input_99" autocomplete="off" placeholder="Nhập lệnh hoặc trò chuyện với Zero..." class="flex-1 bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-medium transition shadow">
                Gửi
            </button>
        </form>
    </footer>

    <div id="key-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4 flex items-center justify-between">
                <span>🔑 Cấu hình Gemini API Key</span>
                <button onclick="toggleKeyModal()" class="text-gray-400 hover:text-white">&times;</button>
            </h3>
            <p class="text-sm text-gray-400 mb-4">Nhập khóa API Gemini của bạn để kích hoạt AI Router và các tính năng thông minh.</p>
            <input type="password" id="api-key-input" name="no_autofill_pass_99" autocomplete="new-password" placeholder="Dán API Key vào đây (AIzaSy...)" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white mb-4 focus:outline-none focus:border-blue-500">
            <div class="flex justify-end space-x-3">
                <button onclick="toggleKeyModal()" class="px-4 py-2 rounded-xl bg-gray-700 hover:bg-gray-600 text-gray-300">Đóng</button>
                <button onclick="saveApiKey()" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-medium">Lưu Key</button>
            </div>
            <div id="key-status" class="mt-3 text-xs text-center"></div>
        </div>
    </div>

    <script>
        // Tự động kiểm tra API Key khi mở trang
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch("/api/get-key");
                const data = await res.json();
                if (!data.success || !data.api_key) {
                    // Chưa có key -> Hiện modal cấu hình tự động
                    document.getElementById("key-modal").classList.remove("hidden");
                }
            } catch (e) {
                console.error("Lỗi kiểm tra key:", e);
            }
        });

        function toggleKeyModal() {
            const modal = document.getElementById("key-modal");
            modal.classList.toggle("hidden");
            if (!modal.classList.contains("hidden")) {
                loadCurrentKey();
            }
        }

        async function loadCurrentKey() {
            try {
                const res = await fetch("/api/get-key");
                const data = await res.json();
                if (data.success && data.api_key) {
                    document.getElementById("api-key-input").value = data.api_key;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function saveApiKey() {
            const apiKey = document.getElementById("api-key-input").value.trim();
            const statusEl = document.getElementById("key-status");
            if (!apiKey) {
                statusEl.textContent = "Vui lòng nhập API Key hợp lệ!";
                statusEl.className = "mt-3 text-xs text-center text-red-400";
                return;
            }

            try {
                const res = await fetch("/api/save-key", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ api_key: apiKey, key_name: "GEMINI_API_KEY" })
                });
                const data = await res.json();
                if (data.success) {
                    statusEl.textContent = data.message;
                    statusEl.className = "mt-3 text-xs text-center text-green-400";
                    setTimeout(() => {
                        toggleKeyModal();
                        statusEl.textContent = "";
                    }, 1500);
                } else {
                    statusEl.textContent = "Lỗi: " + data.error;
                    statusEl.className = "mt-3 text-xs text-center text-red-400";
                }
            } catch (e) {
                statusEl.textContent = "Lỗi kết nối server!";
                statusEl.className = "mt-3 text-xs text-center text-red-400";
            }
        }

        async function sendCommand() {
            const inputEl = document.getElementById("user-input");
            const text = inputEl.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            inputEl.value = "";

            try {
                const res = await fetch("/api/command", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ command: text })
                });
                const data = await res.json();
                const reply = data.reply || "Không có phản hồi.";
                appendMessage(reply, "assistant");
                playTts(reply);
            } catch (e) {
                appendMessage("Lỗi kết nối đến server.", "assistant");
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'items-start'} space-x-3`;
            
            const bubble = document.createElement("div");
            bubble.className = sender === 'user' 
                ? "bg-blue-600 text-white rounded-2xl px-4 py-2.5 max-w-md shadow" 
                : "bg-gray-800 border border-gray-700 text-gray-100 rounded-2xl px-4 py-2.5 max-w-md shadow";
            bubble.textContent = text;
            
            div.appendChild(bubble);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Sử dụng Web Speech API để đọc văn bản thành giọng nói trực tiếp trên trình duyệt
        function playTts(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("Trình duyệt không hỗ trợ Web Speech API.");
            }
        }

        let recognition = null;
        function toggleSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói.");
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';
            recognition.interimResults = false;
            
            const micBtn = document.getElementById("mic-btn");
            micBtn.classList.add("bg-red-600", "animate-pulse");

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript;
                document.getElementById("user-input").value = speechText;
                sendCommand();
            };

            recognition.onerror = () => {
                micBtn.classList.remove("bg-red-600", "animate-pulse");
            };

            recognition.onend = () => {
                micBtn.classList.remove("bg-red-600", "animate-pulse");
            };

            recognition.start();
        }
    </script>
</body>
</html>
